<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2353fc18'/%3E%3Cpath d='M36 8 16 38h12l-4 18 24-32H34l6-16z' fill='%230a0a0c'/%3E%3C/svg%3E">

<body>
<div class="glow g1" aria-hidden="true"></div><div class="glow g2" aria-hidden="true"></div>
<div class="box">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M18.5 3 7 18h7.5L12 29l13-16h-7.8z"/></svg></span>

  <input type="password" id="pw" placeholder="юзер лох" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Подключиться</button>
  <div class="err" id="err"></div>
</div>
<script src="/assets/login.js"></script>
